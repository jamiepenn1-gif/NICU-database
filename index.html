<style>
@import url('https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap');

:root {
  --navy:#1a3a5c; --teal:#2a7d8c; --teal-light:#3fa8ba; --gold:#e8a020;
  --soft-bg:#f4f7fa; --white:#fff; --border:#d0dce8;
  --text:#1e2d3d; --text-light:#5a6e82;
  --cat-care:#2a7d8c; --cat-adm:#2d7a4f; --cat-med:#6b4fa0;
  --cat-equip:#c25e1a; --cat-doc:#1a3a5c; --cat-policy:#b83232; --cat-staff:#7a5c2a;
}

* {box-sizing:border-box;margin:0;padding:0;}

body {
  font-family:'Source Sans 3', sans-serif;
  background:var(--soft-bg);
  color:var(--text);
  font-size:17px;
  line-height:1.6;
}

/* HEADER */
header {
  background:var(--navy);
  color:white;
  padding:28px 40px 22px;
  border-bottom:5px solid var(--gold);
}

header h1 {
  font-family:'Merriweather', serif;
  font-size:2rem;
  margin-bottom:4px;
}

.header-row {
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:16px;
}

.last-updated {
  font-size:.85rem;
  color:#7aaec8;
  background:rgba(255,255,255,.08);
  padding:6px 14px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,.15);
}

/* SEARCH */
.search-section {
  background:var(--navy);
  padding:0 40px 28px;
}

.search-wrap {
  position:relative;
  max-width:640px;
}

.search-wrap input {
  width:100%;
  padding:16px 20px 16px 52px;
  font-size:1.15rem;
  border:2px solid rgba(255,255,255,.2);
  border-radius:10px;
  background:rgba(255,255,255,.97);
  color:var(--text);
  outline:none;
  transition:border-color .2s;
  font-family:'Source Sans 3', sans-serif;
}

.search-wrap input:focus {
  border-color:var(--gold);
}

.search-icon {
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  font-size:1.3rem;
  color:var(--text-light);
  pointer-events:none;
}

.search-hint {
  color:#7aaec8;
  font-size:.85rem;
  margin-top:8px;
  margin-left:4px;
}

/* ===== FULL CARD CLICKABLE FIX ===== */
.card {
  position: relative;
}

.card-link-overlay {
  position: absolute;
  inset: 0;
  z-index: 1;
}

.card-top,
.card-desc,
.card-tags,
.card-footer {
  position: relative;
  z-index: 2;
}

.card-footer a {
  position: relative;

<script>
// ============================================================
// SYNONYM MAP — maps what a nurse might type → canonical term
// ============================================================
const SYNONYMS = {
  // Blood-related

  // Jaundice

  // Cooling
  "cool baby": "hypothermia",

  // Discharge

  // Sepsis

  "infection workup": "sepsis",
  // IV/Access
  "infiltrate": "PIV",

  "no iv access": "PIV flowchart",
  "blown iv": "PIV flowchart",
  // PICC
  "central line": "PICC",
  "tpn line": "PICC",
  // Vaccines/Immunizations
  "shots": "immunization",
  "2 month vaccines": "immunization",
  "vaccines": "immunization",
  "shot": "immunization",
  // Hep B
  "hbsag": "hepatitis B",
  "hbig": "hepatitis B",
  "positive mom hep": "hepatitis B",
  // Gent level
  "gent level": "gentamicin",
  "drug level": "gentamicin",
  "antibiotic level": "gentamicin",
  // RSV
  "rsv": "Beyfortus",
  "rsv shot": "Beyfortus",
  "rsv prevention": "Beyfortus",
  // Wound
  "bleeding": "stat seal",
  "wound care": "VASHE",
  "skin wound": "VASHE",
  "diaper rash": "butt paste",
  "skin breakdown": "butt paste",
  // Downtime
  "system down": "EPIC downtime",
  "epic down": "EPIC downtime",
  "offline": "EPIC downtime",
  // Camera
  "baby camera": "Rover camera",
  "parent camera": "Rover camera",
  "nicview": "Rover camera",
  // ROP
  "eye exam": "ROP",
  "eye screen": "ROP",
  "retinal": "ROP",
  // Thermoregulation
  "cold baby": "thermoregulation",
  "temp": "thermoregulation",
  "temperature": "thermoregulation",
  // Safe sleep
  "sids": "safe sleep",
  "sleeping position": "safe sleep",
  // Social work
  "cps": "social work",
  "family support": "social work",
  // Bereavement
  "baby died": "bereavement",
  "infant death": "bereavement",
  "end of life": "bereavement",
  "comfort care": "bereavement",
  // Viability
  "22 weeks": "viability",
  "23 weeks": "viability",
  "periviable": "viability",
  // Car seat
  "90 minute": "car seat",
  "car seat test": "car seat study",
  // Circ
  "circ": "circumcision",
  "plastibell": "circumcision",
  // Refusal
  "ama": "refusal",
  "refuses": "refusal",
  // Transport
  "transfer": "transport",
  "going to another hospital": "transport",
  // Omnibed
  "giraffe bed": "omni bed",
  "incubator": "omni bed",
  "warmer": "omni bed",
  // Humidity
  "humidification": "humidity",
  "moisture": "humidity",
  // Printing
  "wristband": "printing labels",
  "armband": "printing labels",
  "id band": "printing labels",
  // Genetics
  "karyotype": "chromosomes",
  "trisomy": "chromosomes",
  "genetics": "chromosomes",
  // CMV
  "cytomegalovirus": "CMV",
  // Rapid response
  "code blue": "urgent response",
  "rrt": "urgent response",
  "deteriorating": "urgent response",
};

let activeCat = 'all';
let activeType = 'all';
let searchQuery = '';
let acIndex = -1;

const searchInput = document.getElementById('search-input');
const acBox = document.getElementById('ac-box');
const dymBar = document.getElementById('dym-bar');
const countNum = document.getElementById('count-num');
const countLabel = document.getElementById('results-count');
const clearBtn = document.getElementById('clear-btn');
const jumpBtn = document.getElementById('jump-top');

// Build autocomplete list from all card titles
function getAllTitles() {
  return Array.from(document.querySelectorAll('.card')).map(c => ({
    title: c.dataset.title,
    section: c.closest('.category-section')?.dataset.section || '',
    type: c.dataset.type,
    el: c
  }));
}

const CAT_COLORS = {
  care:'#2a7d8c', adm:'#2d7a4f', med:'#6b4fa0',
  equip:'#c25e1a', doc:'#1a3a5c', policy:'#b83232', staff:'#7a5c2a'
};

function showAutocomplete(q) {
  if (!q || q.length < 2) { acBox.classList.remove('open'); return; }
  const items = getAllTitles().filter(item => {
    const tags = item.el.dataset.tags || '';
    const desc = item.el.querySelector('.card-desc')?.textContent || '';
    const s = q.toLowerCase();
    return item.title.toLowerCase().includes(s) || tags.toLowerCase().includes(s) || desc.toLowerCase().includes(s);
  }).slice(0, 7);
  if (!items.length) { acBox.classList.remove('open'); return; }
  acBox.innerHTML = items.map((item, i) =>
    `<div class="ac-item" data-i="${i}" onclick="selectAC('${item.title.replace(/'/g,"\\'")}')">
      <span class="ac-cat-dot" style="background:${CAT_COLORS[item.section]||'#aaa'}"></span>
      <div><div class="ac-item-title">${item.title}</div><div class="ac-item-sub">${item.section ? item.section.toUpperCase() : ''} · ${item.type}</div></div>
    </div>`
  ).join('');
  acBox.classList.add('open');
  acIndex = -1;
}

function selectAC(title) {
  searchInput.value = title;
  searchQuery = title;
  acBox.classList.remove('open');
  applyFilters();
  searchInput.focus();
}

// DYM: check if search term maps to a synonym
function checkDYM(q) {
  if (!q) { dymBar.style.display = 'none'; return null; }
  const lq = q.toLowerCase().trim();
  for (const [k, v] of Object.entries(SYNONYMS)) {
    if (lq === k || lq.includes(k)) {
      return { from: q, to: v };
    }
  }
  return null;
}

function showDYM(dym, shown) {
  if (!dym || shown > 0) { dymBar.style.display = 'none'; return; }
  dymBar.style.display = 'block';
  dymBar.innerHTML = `🔎 No results for "<strong>${dym.from}</strong>". Did you mean: <span class="dym-link" onclick="useDYM('${dym.to}')">${dym.to}</span>?`;
}

function useDYM(term) {
  searchInput.value = term;
  searchQuery = term;
  dymBar.style.display = 'none';
  acBox.classList.remove('open');
  applyFilters();
}

function updateCatCounts() {
  document.querySelectorAll('.category-section').forEach(sec => {
    const visible = sec.querySelectorAll('.card:not([style*="display: none"])').length;
    const hdr = sec.querySelector('.cat-count');
    if (hdr) hdr.textContent = visible + ' items';
    sec.style.display = visible === 0 ? 'none' : '';
  });
}

function applyFilters() {
  const cards = document.querySelectorAll('.card');
  let shown = 0;
  const q = searchQuery.toLowerCase().trim();

  cards.forEach(card => {
    const title = (card.dataset.title || '').toLowerCase();
    const type  = (card.dataset.type  || '').toLowerCase();
    const tags  = (card.dataset.tags  || '').toLowerCase();
    const desc  = (card.querySelector('.card-desc')?.textContent || '').toLowerCase();
    const section = card.closest('.category-section')?.dataset.section || '';

    const matchCat    = activeCat === 'all' || section === activeCat;
    const matchType   = activeType === 'all' || type === activeType;
    const matchSearch = !q || title.includes(q) || tags.includes(q) || desc.includes(q);

    if (matchCat && matchType && matchSearch) {
      card.style.display = '';
      shown++;
    } else {
      card.style.display = 'none';
    }
  });

  countNum.textContent = shown;
  countLabel.innerHTML = shown === 0
    ? 'No entries found'
    : `Showing <strong>${shown}</strong> entr${shown === 1 ? 'y' : 'ies'}`;

  document.getElementById('no-results').style.display = shown === 0 ? 'block' : 'none';
  updateCatCounts();
  clearBtn.style.display = (activeCat !== 'all' || activeType !== 'all' || searchQuery) ? 'inline-block' : 'none';

  // DYM only fires when 0 results
  if (shown === 0 && q) {
    const dym = checkDYM(q);
    showDYM(dym, shown);
  } else {
    dymBar.style.display = 'none';
  }
}

function filterCat(cat, btn) {
  activeCat = cat;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function filterType(type, btn) {
  activeType = type;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function clearAll() {
  activeCat = 'all'; activeType = 'all'; searchQuery = '';
  searchInput.value = '';
  acBox.classList.remove('open');
  dymBar.style.display = 'none';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.tab-btn.all').classList.add('active');
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.type-btn:first-of-type').classList.add('active');
  applyFilters();
}

// Keyboard nav for autocomplete
searchInput.addEventListener('keydown', e => {
  const items = acBox.querySelectorAll('.ac-item');
  if (e.key === 'ArrowDown') {
    acIndex = Math.min(acIndex + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('selected', i === acIndex));
    e.preventDefault();
  } else if (e.key === 'ArrowUp') {
    acIndex = Math.max(acIndex - 1, -1);
    items.forEach((el, i) => el.classList.toggle('selected', i === acIndex));
    e.preventDefault();
  } else if (e.key === 'Enter' && acIndex >= 0) {
    items[acIndex]?.click();
    e.preventDefault();
  } else if (e.key === 'Escape') {
    acBox.classList.remove('open');
  }
});

searchInput.addEventListener('input', e => {
  searchQuery = e.target.value;
  showAutocomplete(searchQuery);
  applyFilters();
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) acBox.classList.remove('open');
});

window.addEventListener('scroll', () => {
  jumpBtn.style.display = window.scrollY > 400 ? 'flex' : 'none';
});

updateCatCounts();
applyFilters();
</script>
